<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa XP</title>
    <meta
      name="description"
      content="Ordens de renda variável, disparo de renda fixa e calendário de presença da mesa, num link só."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Antes da primeira pintura, senão a tela pisca no tema errado a cada carregamento.
      // Navegador sem escolha gravada abre no escuro (ver src/ui/tema.js).
      (() => {
        let tema = null;
        try {
          tema = localStorage.getItem('xp_tema');
        } catch {}
        if (tema !== 'claro' && tema !== 'escuro') tema = 'escuro';
        document.documentElement.dataset.tema = tema;
        document.documentElement.style.colorScheme = tema === 'claro' ? 'light' : 'dark';
      })();
    </script>
  </head>

  <body>
    <header class="casca-topo">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">XP</span>
        <div>
          <strong>Mesa XP</strong>
          <span class="sub-badge">back office</span>
        </div>
      </div>

      <nav class="abas" aria-label="Ferramentas">
        <a class="aba" href="#ordens" data-aba="ordens" title="Ordens (Alt + 1)">Ordens</a>
        <a class="aba" href="#rendafixa" data-aba="rendafixa" title="Renda Fixa (Alt + 2)">Renda Fixa</a>
        <a class="aba" href="#calendario" data-aba="calendario" title="Calendário (Alt + 3)">Calendário</a>
        <a class="aba" href="#operacional" data-aba="operacional" title="Operacional: base de conhecimento da mesa (Alt + 4)">Operacional</a>
      </nav>

      <div class="header-actions">
        <button id="btn-historico" class="header-btn" data-so-na-aba="ordens" title="Histórico de ordens (Alt + H)">
          Histórico
          <span id="contador-historico" class="counter-badge">0</span>
        </button>

        <button id="btn-tema" class="header-btn icone" type="button" aria-label="Alternar tema">
          <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.6v2.4M12 19v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.6 12h2.4M19 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" />
          </svg>
          <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section id="modulo-ordens" class="modulo" aria-label="Ordens">
        <div class="container">
          <section class="panel" id="painel-entrada">
            <div class="panel-header-row">
              <h2 class="panel-title">Solicitação</h2>
              <span id="contador-linhas" class="meta-counter">0 linhas</span>
            </div>

            <textarea
              id="entrada"
              spellcheck="false"
              placeholder="Cole aqui a solicitação, do jeito que ela chegou — inclusive colada direto do grupo.&#10;&#10;7000001&#10;COMPRA&#10;IVVB11 - 7 qntds&#10;via email"
            ></textarea>

            <div class="button-group">
              <button class="primary" id="btn-analisar" title="Analisar (Ctrl + Enter)">Analisar</button>
              <button class="secondary" id="btn-colar">Colar e analisar</button>
              <button class="danger" id="btn-limpar" title="Limpar (Esc)">Limpar</button>
            </div>

            <div class="presets-toolbar">
              <span class="presets-label">Exemplos</span>
              <div class="presets-buttons" id="presets"></div>
            </div>
          </section>

          <section class="panel" id="painel-formatos">
            <div class="panel-header-row">
              <h2 class="panel-title">Formatos de saída</h2>
              <span id="deteccao" class="meta-counter"></span>
            </div>

            <div class="formatos" id="formatos">
              <label class="formato"><input type="checkbox" value="email" /><span>Ordem por e-mail</span></label>
              <label class="formato"><input type="checkbox" value="auditoria" /><span>E-mail em tabela</span></label>
              <label class="formato"><input type="checkbox" value="lote" /><span>Lote Simples</span></label>
              <label class="formato"><input type="checkbox" value="twap" /><span>Lote TWAP</span></label>
            </div>
          </section>

          <div id="solicitacoes"></div>

          <section class="panel" id="vazio">
            <div class="empty-state">
              <p>Nada analisado ainda.</p>
              <span>Cole uma solicitação acima, ou comece por um dos exemplos.</span>
            </div>
          </section>
        </div>

        <div id="overlay-historico" class="drawer-overlay"></div>
        <aside id="drawer-historico" class="history-drawer" aria-hidden="true">
          <div class="drawer-header">
            <div class="drawer-title-group">
              <strong>Histórico</strong>
              <span class="meta-counter">últimas ordens copiadas</span>
            </div>
            <button id="btn-fechar-historico" class="icon-close-btn" title="Fechar (Esc)">&times;</button>
          </div>

          <div class="drawer-search">
            <input type="text" id="busca-historico" placeholder="Buscar por conta, ticker ou formato..." />
          </div>

          <div id="lista-historico" class="history-list"></div>

          <div class="drawer-footer">
            <button id="btn-limpar-historico" class="btn-clear-history">Limpar histórico</button>
          </div>
        </aside>
      </section>
      <section id="modulo-rendafixa" class="modulo" aria-label="Renda Fixa" hidden></section>
      <section id="modulo-calendario" class="modulo" aria-label="Calendário" hidden></section>
      <section id="modulo-operacional" class="modulo" aria-label="Operacional" hidden></section>
    </main>

    <div id="toasts"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
